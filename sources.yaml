# =====================================================================
#  NW AI Domains Feed — konfiguracja
#  Edytujesz TYLKO ten plik, żeby dodać/usunąć źródła i sterować outputem.
# =====================================================================

feed:
  # threat.source wpisany do każdego wiersza (bump przy większych zmianach)
  threat_source: nw-llm-v1.0
  # plik wyjściowy (format F.07: host,threat.category,threat.desc,threat.source ; bez nagłówka)
  output: feed/F.07_llm_providers.csv
  # role hostów, które trafiają do feedu. Usuń 'web' jeśli nie chcesz
  # docs/status/cdn/forum itp. (szum dla detekcji exfil — zostają tylko api+chat).
  include_roles: [api, chat, web, other]

sources:
  - name: abixb-llm-hosts
    url: https://raw.githubusercontent.com/abixb/llm-hosts-blocklist/main/hosts
    format: hosts            # linie "0.0.0.0 domena" + nagłówki sekcji "# Provider"
    default_category: llm-provider

  # Dodaj kolejne źródła tutaj. Obsługiwane format: hosts | domains
  # - name: jakies-inne-repo
  #   url: https://raw.githubusercontent.com/owner/repo/main/domains.txt
  #   format: domains        # jedna domena na linię, '#' = komentarz
  #   default_category: llm-provider

  # --- OPCJONALNE: strony z TRESCIA generowana przez AI (INNY cel) ---
  # To NIE sa endpointy providerow/API, tylko serwisy publikujace AI-content.
  # Wlaczasz tylko jesli chcesz je sledzic osobno - dostaja kategorie
  # 'ai-content-site', wiec nie mieszaja sie z 'llm-provider'.
  # - name: stopthetoken-ai-content
  #   url: https://raw.githubusercontent.com/mklemmingen/StopTheToken/main/blocklist.txt
  #   format: domains
  #   default_category: ai-content-site

# Reguły klasyfikacji threat.category na podstawie roli/hosta (pierwsze trafienie wygrywa).
# Rola jest wykrywana z prefiksu hosta (api., chat., console., docs. ...).
classify:
  consumer_hosts:           # zawsze ai-consumer (interfejsy webowe = ryzyko treningu na danych)
    - chat.openai.com
    - chatgpt.com
    - claude.ai
    - app.claude.ai
    - gemini.google.com
    - copilot.microsoft.com
    - www.perplexity.ai
  coding_markers:           # jeśli host zawiera któryś z tych członów -> ai-coding
    - copilot
    - cursor
    - tabnine
    - codeium
    - sourcegraph
